name: Publish to Gradle Plugin Portal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

permissions:
  contents: write  # Required for uploading release assets

jobs:
  publish:
    name: Publish Plugin
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Validate release version and publication metadata
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        DISPATCH_VERSION: ${{ github.event.inputs.version }}
      run: |
        set -euo pipefail

        if [[ "$EVENT_NAME" == "release" ]]; then
          expected_version="$RELEASE_TAG"
        else
          expected_version="$DISPATCH_VERSION"
        fi
        expected_version="${expected_version#v}"

        gradle_output="$(./gradlew -q :plugin:properties :plugin:generatePomFileForJsonassetsminifyPublication)"
        actual_version="$(printf '%s\n' "$gradle_output" | awk -F': ' '$1 == "version" { print $2; exit }')"
        if [[ -z "$actual_version" ]]; then
          echo "Could not determine the Gradle project version" >&2
          exit 1
        fi

        if [[ "$expected_version" != "$actual_version" ]]; then
          echo "Release version mismatch: expected $expected_version, project is $actual_version" >&2
          exit 1
        fi

        echo "Validated release version: $actual_version"

        pom_file="plugin/build/publications/jsonassetsminify/pom-default.xml"
        pom_version="$(awk '
          /<artifactId>jsonassetsminify<\/artifactId>/ { found=1; next }
          found && /<version>/ {
            gsub(/.*<version>|<\/version>.*/, "")
            print
            exit
          }
        ' "$pom_file")"
        if [[ -z "$pom_version" ]]; then
          echo "Could not determine the publication POM version" >&2
          exit 1
        fi

        if [[ "$pom_version" != "$actual_version" ]]; then
          echo "Publication version mismatch: POM is $pom_version, project is $actual_version" >&2
          exit 1
        fi
        echo "Validated publication version: $pom_version"
        
    - name: Run tests
      run: ./gradlew :plugin:check
      
    - name: Publish to Gradle Plugin Portal
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      run: ./gradlew :plugin:publishPlugins -Pgradle.publish.key="${GRADLE_PUBLISH_KEY}" -Pgradle.publish.secret="${GRADLE_PUBLISH_SECRET}"
      
    - name: Upload plugin JARs to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          plugin/build/libs/*.jar
      
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: build-artifacts
        path: plugin/build/libs/
        retention-days: 7
